services:
  discovery-server:
    build:
      context: ./discovery-server

  config-server:
    build:
      context: ./config-server
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on:
      discovery-server:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - echo > /dev/tcp/127.0.0.1/8888
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  gateway-service:
    build:
      context: ./gateway-service
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      product-service:
        condition: service_started
      product-service-2:
        condition: service_started
      order-service:
        condition: service_started
      cart-service:
        condition: service_started
      search-service:
        condition: service_started

  product-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: shopstream_root_dev
      MYSQL_DATABASE: productdb
      MYSQL_USER: product_user
      MYSQL_PASSWORD: product_dev_password
    volumes:
      - product-db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1
          -u"$${MYSQL_USER}"
          -p"$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}"
          -e "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  product-service:
    build:
      context: ./product-service
    environment:
      EUREKA_INSTANCE_INSTANCE_ID: product-service-1
    depends_on:
      config-server:
        condition: service_healthy
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-service:
        condition: service_started

  product-service-2:
    build:
      context: ./product-service
    environment:
      EUREKA_INSTANCE_INSTANCE_ID: product-service-2
    depends_on:
      config-server:
        condition: service_healthy
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-service:
        condition: service_started

  order-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: shopstream_order_root_dev
      MYSQL_DATABASE: orderdb
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_dev_password
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1
          -u"$${MYSQL_USER}"
          -p"$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}"
          -e "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  order-service:
    build:
      context: ./order-service
    depends_on:
      config-server:
        condition: service_healthy
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.2
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  notification-service:
    build:
      context: ./notification-service
    volumes:
      - notification-data:/app/data
    depends_on:
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS
          "http://elasticsearch:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          > /dev/null
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  search-service:
    build:
      context: ./search-service
    depends_on:
      config-server:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started

  redis:
    image: redis:7.4
    environment:
      REDIS_PASSWORD: shopstream_redis_dev
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  cart-service:
    build:
      context: ./cart-service
    depends_on:
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-service:
        condition: service_started

volumes:
  product-db-data:
  order-db-data:
  kafka-data:
  notification-data:
  elasticsearch-data:
  redis-data:
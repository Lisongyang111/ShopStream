services:
  product-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: shopstream_root_dev
      MYSQL_DATABASE: productdb
      MYSQL_USER: product_user
      MYSQL_PASSWORD: product_dev_password
    ports:
      - "3308:3306"
    volumes:
      - product-db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1
          -u"$${MYSQL_USER}"
          -p"$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}"
          -e "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  product-service:
    build:
      context: ./product-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://product-db:3306/productdb
      SPRING_DATASOURCE_USERNAME: product_user
      SPRING_DATASOURCE_PASSWORD: product_dev_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: shopstream_order_root_dev
      MYSQL_DATABASE: orderdb
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_dev_password
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1
          -u"$${MYSQL_USER}"
          -p"$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}"
          -e "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  order-service:
    build:
      context: ./order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://order-db:3306/orderdb
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: order_dev_password
      PRODUCT_SERVICE_URL: http://product-service:8080
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_started
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.2
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  notification-service:
    build:
      context: ./notification-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/notifications;DB_CLOSE_ON_EXIT=FALSE"
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: notification_dev_password
    volumes:
      - notification-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started

volumes:
  product-db-data:
  order-db-data:
  kafka-data:
  notification-data: